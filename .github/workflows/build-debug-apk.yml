name: Build debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fixed signing key (so builds update over each other)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$KS"
          echo "$KS" | base64 -d > "$RUNNER_TEMP/debug.keystore"

      - name: Assemble debug APK
        working-directory: android
        env:
          KAV_DEBUG_KEYSTORE: ${{ runner.temp }}/debug.keystore
        run: ./gradlew :app:assembleDebug -PkavDevId=dev -PkavVersionName=5.2.1-fork.1 --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: kav-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish keyless pre-release (#108)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          gh release create v5.2.1-fork.1 app-debug.apk --prerelease --target "$GITHUB_SHA" --title "Kav-Dev 5.2.1-fork.1" --notes "Fork build of Kav 5.2.1 (Noam's code) plus our leave-now timing and alert (#117, #127). The early-transfer guards (#126, #134) are not added: Noam's 5.2.1 already has its own. Installs over the previous fork build."
