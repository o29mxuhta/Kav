name: Build debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fixed signing key (so builds update over each other)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$KS"
          echo "$KS" | base64 -d > "$RUNNER_TEMP/debug.keystore"

      - name: Assemble debug APK
        working-directory: android
        env:
          KAV_DEBUG_KEYSTORE: ${{ runner.temp }}/debug.keystore
        run: ./gradlew :app:assembleDebug -PkavDevId=dev -PkavVersionName=5.1-fork.50 --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: kav-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish keyless pre-release (#108)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          gh release create v5.1-fork.50 app-debug.apk --prerelease --target "$GITHUB_SHA" --title "Kav-Dev 5.1-fork.50" --notes "Fork build 50 of feature/combined: fork.49 plus the updated leave-now (#117, #127), the updated on-a-bus detector (#116, #120), pay at the train station before a train is chosen (#126, #133) and the early-transfer guards (#126, #134). Installs over the previous build."
