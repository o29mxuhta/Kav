name: Build debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: android
        env:
          KAV_LIVE_KEY: ${{ secrets.KAV_LIVE_KEY }}
        # Fork builds install beside the real Kav: own applicationId (uk.noammm.kav.dev) and name (Kav-Dev).
        run: ./gradlew :app:assembleDebug --console=plain -PkavDevId=dev '-PkavDevName=Kav-Dev'

      - uses: actions/upload-artifact@v4
        with:
          name: kav-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
